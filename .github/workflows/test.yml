name: tokenizer-tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y foma
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q
      - run: python scripts/verify_morphology_lock.py --lock morphology.lock.json --runtime-dir tamil_morph_tokenizer/data/fst-models
